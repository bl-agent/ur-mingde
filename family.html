<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>都更地主家族譜系表 · 北投明德路都更案</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vis.js Network for clean hierarchical tree visualization -->
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    * {
      font-family: 'Inter', 'Noto Sans TC', system-ui, -apple-system, sans-serif !important;
    }
    body {
      background-color: #090d16;
      color: #f1f5f9;
    }
    #networkContainer {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #111827 0%, #090d16 100%);
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden select-none">

  <!-- 頂部功能導航列 -->
  <header class="bg-slate-900/90 border-b border-slate-800 px-4 py-3 flex items-center justify-between shrink-0 z-20 backdrop-blur-md">
    <div class="flex items-center gap-3">
      <a href="index.html" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold transition flex items-center gap-1.5 border border-slate-700 active:scale-95 shadow-sm">
        <span>🏢</span> 返回拜訪系統
      </a>
      <div class="h-5 w-px bg-slate-700 hidden sm:block"></div>
      <div>
        <h1 class="text-sm sm:text-base font-black text-white tracking-wide flex items-center gap-2">
          <span>傳統階層家族譜系表</span>
          <span class="text-xs px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 font-bold border border-amber-500/30">北投明德案</span>
        </h1>
        <p class="text-[11px] text-slate-400 hidden sm:block">代際層級由上至下（父母長輩 ➔ 子女後代）• 依序顯示姓名、身分證與持有門牌</p>
      </div>
    </div>

    <!-- 頂部功能操作按鈕群 -->
    <div class="flex items-center gap-2">
      <button type="button" onclick="openAddPersonModal()" class="px-3.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-black text-xs shadow-md flex items-center gap-1.5 transition active:scale-95">
        <span>➕</span> 新增人物
      </button>
      <button type="button" onclick="openAddRelationModal()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold border border-slate-700 flex items-center gap-1.5 transition active:scale-95">
        <span>🔗</span> 建立關係
      </button>

      <div class="h-5 w-px bg-slate-700 hidden sm:block"></div>

      <!-- 切換檢視模式：樹狀圖 vs 世代卡片 -->
      <div class="inline-flex rounded-xl bg-slate-800 p-0.5 border border-slate-700 text-xs font-bold">
        <button type="button" id="btnViewTree" onclick="switchMainView('tree')" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white shadow-xs transition">
          🌲 族譜樹狀圖
        </button>
        <button type="button" id="btnViewList" onclick="switchMainView('list')" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition">
          📑 世代卡片清單
        </button>
      </div>

      <button type="button" onclick="resetToInitialLiuClan()" class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-300 text-xs font-bold border border-slate-700 transition" title="恢復柳家核心起點（柳清、蕭吳美玉、柳金福）">
        🔄 柳家起點
      </button>
      <button type="button" onclick="clearAllDataConfirm()" class="px-2.5 py-1.5 rounded-xl bg-rose-950/60 hover:bg-rose-900 text-rose-300 text-xs font-bold border border-rose-800/60 transition" title="完全清空畫布，從零開始輸入">
        🧹 完全清空
      </button>
    </div>
  </header>

  <!-- 主工作區域 -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- 檢視模式 1：傳統 Vis.js 垂直階層樹狀畫布 -->
    <div id="treeViewContainer" class="flex-1 w-full h-full relative">
      <div id="networkContainer"></div>

      <!-- 畫面左下角：卡片格式說明圖例 -->
      <div class="absolute bottom-4 left-4 bg-slate-900/90 border border-slate-800 rounded-2xl p-3.5 text-xs backdrop-blur-md shadow-2xl space-y-2 pointer-events-auto max-w-xs">
        <div class="font-bold text-white flex items-center justify-between border-b border-slate-800 pb-1.5">
          <span>📇 人物卡片格式說明</span>
          <span class="text-[10px] text-slate-400 font-normal">一層一層排輩份</span>
        </div>
        <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-left space-y-1">
          <div class="text-sm font-black text-amber-400">1. 人物姓名 (主標題)</div>
          <div class="text-[11px] font-mono text-slate-400">2. 身分證字號 (如果有)</div>
          <div class="text-[11px] text-sky-400 font-semibold">3. 🏠 門牌號碼 (若有多戶逐一條列)</div>
        </div>
        <div class="flex items-center gap-3 pt-1 text-[11px] text-slate-400">
          <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-amber-500"></span> 第一代(父母)</span>
          <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-blue-500"></span> 第二代(子女)</span>
          <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-emerald-500"></span> 第三代(孫輩)</span>
        </div>
      </div>

      <!-- 畫面右下角：視野縮放工具列 -->
      <div class="absolute bottom-4 right-4 flex items-center gap-1 bg-slate-900/90 border border-slate-800 rounded-xl p-1 text-xs backdrop-blur-md shadow-xl">
        <button type="button" onclick="zoomTree(0.2)" class="w-8 h-8 rounded-lg hover:bg-slate-800 text-slate-300 font-bold flex items-center justify-center transition" title="放大">🔍+</button>
        <button type="button" onclick="zoomTree(-0.2)" class="w-8 h-8 rounded-lg hover:bg-slate-800 text-slate-300 font-bold flex items-center justify-center transition" title="縮小">🔍-</button>
        <button type="button" onclick="fitTree()" class="px-2.5 h-8 rounded-lg hover:bg-slate-800 text-slate-300 font-bold flex items-center justify-center transition" title="重設視角置中">置中</button>
      </div>
    </div>

    <!-- 檢視模式 2：世代卡片清單 (Generational List View) -->
    <div id="listViewContainer" class="hidden flex-1 w-full h-full overflow-y-auto p-4 sm:p-6 custom-scrollbar bg-slate-950">
      <div class="max-w-4xl mx-auto space-y-6" id="generationalCardsWrapper">
        <!-- Rendered via JS -->
      </div>
    </div>

    <!-- 右側人物詳情與筆記側邊抽屜 -->
    <div id="personDetailDrawer" class="hidden w-80 sm:w-96 bg-slate-900 border-l border-slate-800 flex flex-col shrink-0 z-30 shadow-2xl transition-all duration-200">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-850">
        <div class="flex items-center gap-2">
          <span class="text-lg">👤</span>
          <h3 class="text-sm font-black text-white" id="drawerPersonName">人物檔案</h3>
        </div>
        <div class="flex items-center gap-1">
          <button type="button" onclick="editCurrentSelectedPerson()" class="p-1.5 rounded-lg text-indigo-400 hover:bg-slate-800 transition text-xs font-bold" title="編輯此人物資料">
            ✏️ 編輯
          </button>
          <button type="button" onclick="deleteCurrentSelectedPerson()" class="p-1.5 rounded-lg text-rose-400 hover:bg-slate-800 transition text-xs font-bold" title="刪除此人物">
            🗑️
          </button>
          <button type="button" onclick="closePersonDrawer()" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
            ✕
          </button>
        </div>
      </div>

      <div class="p-4 space-y-4 flex-1 overflow-y-auto custom-scrollbar text-xs">
        <!-- 基本資訊卡 -->
        <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 space-y-2">
          <div class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">階層身分資訊</div>
          <div class="space-y-1.5">
            <div><span class="text-slate-500">姓名：</span> <span id="drawerName" class="text-white font-bold text-sm"></span></div>
            <div><span class="text-slate-500">輩份世代：</span> <span id="drawerGeneration" class="text-amber-400 font-bold"></span></div>
            <div><span class="text-slate-500">身分證字號：</span> <span id="drawerIdCode" class="text-slate-300 font-mono"></span></div>
            <div><span class="text-slate-500">稱謂/角色：</span> <span id="drawerRole" class="text-slate-300"></span></div>
          </div>
        </div>

        <!-- 持有門牌清冊 -->
        <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 space-y-2">
          <div class="text-[10px] font-bold text-sky-400 uppercase tracking-wider">名下/持有房屋門牌 (若有多於一戶皆列出)</div>
          <div id="drawerDoorsList" class="space-y-1.5 text-slate-200">
            <!-- Rendered via JS -->
          </div>
        </div>

        <!-- 親屬網絡關聯 -->
        <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 space-y-2">
          <div class="text-[10px] font-bold text-indigo-400 uppercase tracking-wider">族譜直系與婚姻關聯</div>
          <div id="drawerRelationsList" class="space-y-1 text-slate-300">
            <!-- Rendered via JS -->
          </div>
        </div>

        <!-- 筆記與線索分析 -->
        <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 space-y-1.5">
          <div class="text-[10px] font-bold text-amber-400 uppercase tracking-wider">背景情資與傳聞備註</div>
          <div id="drawerNotes" class="text-slate-300 leading-relaxed whitespace-pre-wrap">--</div>
        </div>
      </div>
    </div>

  </div>

  <!-- MODAL: 新增/編輯人物對話框 -->
  <div id="personModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full shadow-2xl overflow-hidden flex flex-col">
      <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-850">
        <h3 class="text-sm font-black text-white" id="personModalTitle">新增族譜人物</h3>
        <button type="button" onclick="closePersonModal()" class="text-slate-400 hover:text-white text-sm">✕</button>
      </div>

      <form id="personForm" onsubmit="handleSavePerson(event)" class="p-5 space-y-3.5 text-xs">
        <input type="hidden" id="editPersonId" value="">

        <div>
          <label class="block font-bold text-slate-300 mb-1">人物姓名 <span class="text-rose-400">*</span></label>
          <input type="text" id="inputName" required placeholder="例如：柳金福、蕭吳美玉" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-slate-300 mb-1">輩份階層 (由上到下) <span class="text-rose-400">*</span></label>
            <select id="inputLevel" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
              <option value="1">第 1 代（父母長輩層）</option>
              <option value="2" selected>第 2 代（子女晚輩層）</option>
              <option value="3">第 3 代（孫輩層）</option>
              <option value="0">第 0 代（祖父/祖先層）</option>
            </select>
          </div>
          <div>
            <label class="block font-bold text-slate-300 mb-1">性別/稱謂</label>
            <select id="inputGender" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
              <option value="male">男性 (父/子/兄/弟)</option>
              <option value="female">女性 (母/女/妻/姊/妹)</option>
              <option value="other">未知/長輩</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-300 mb-1">身分證字號 (如果有)</label>
          <input type="text" id="inputIdCode" placeholder="例如：A123*****4 (留空則不顯示)" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block font-bold text-slate-300 mb-1">持有房屋門牌號 (若多個請以逗號或換行分開)</label>
          <textarea id="inputDoors" rows="2" placeholder="例如：
明德路215巷2弄12號 1樓
明德路225號 4樓" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500 leading-relaxed"></textarea>
          <p class="text-[10px] text-slate-400 mt-0.5">系統將在姓名與身分證下方，依序完整呈現所有門牌。</p>
        </div>

        <div>
          <label class="block font-bold text-slate-300 mb-1">身分背景與傳聞備註</label>
          <textarea id="inputNotes" rows="2" placeholder="例如：柳清之妻，相傳有三次婚姻..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-slate-300 focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <div class="pt-2 flex items-center justify-end gap-2 border-t border-slate-800">
          <button type="button" onclick="closePersonModal()" class="px-4 py-2 rounded-xl text-slate-400 hover:text-white font-bold transition">取消</button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-black shadow-md transition">儲存人物</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: 建立親屬/配偶關係對話框 -->
  <div id="relationModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full shadow-2xl overflow-hidden flex flex-col">
      <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-850">
        <h3 class="text-sm font-black text-white">建立親屬／婚姻連線</h3>
        <button type="button" onclick="closeRelationModal()" class="text-slate-400 hover:text-white text-sm">✕</button>
      </div>

      <form id="relationForm" onsubmit="handleSaveRelation(event)" class="p-5 space-y-3.5 text-xs">
        <div>
          <label class="block font-bold text-slate-300 mb-1">關係起點人物 (A)</label>
          <select id="relFromPerson" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
            <!-- Populated via JS -->
          </select>
        </div>

        <div>
          <label class="block font-bold text-slate-300 mb-1">親屬/婚姻關係類型</label>
          <select id="relType" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
            <option value="parent_child">父子 / 母子（由上至下代際連線）</option>
            <option value="spouse_current">夫妻（同輩現任配偶，實線雙向）</option>
            <option value="spouse_ex">前夫 / 前妻（再婚或傳聞，虛線標記）</option>
            <option value="siblings">兄弟姊妹（同輩手足連線）</option>
          </select>
        </div>

        <div>
          <label class="block font-bold text-slate-300 mb-1">關係目標人物 (B)</label>
          <select id="relToPerson" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
            <!-- Populated via JS -->
          </select>
        </div>

        <div>
          <label class="block font-bold text-slate-300 mb-1">連線標籤 / 補充說明 (選填)</label>
          <input type="text" id="relLabel" placeholder="例如：長子、再婚前夫？" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div class="pt-2 flex items-center justify-end gap-2 border-t border-slate-800">
          <button type="button" onclick="closeRelationModal()" class="px-4 py-2 rounded-xl text-slate-400 hover:text-white font-bold transition">取消</button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-black shadow-md transition">建立連線</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 預設資料：僅保留柳家與蕭吳美玉核心起點，砍掉所有多餘蜘蛛網
    const LIU_INITIAL_DATA = {
      persons: [
        {
          id: 'p_liu_qing',
          name: '柳清',
          level: 1, // 第1代：父母長輩層
          gender: 'male',
          idCode: '', // 若無身分證則不顯示
          doors: [], // 長輩若無直接持有門牌則留空
          notes: '柳家老長輩，配偶蕭吳美玉，育有柳金福等人。'
        },
        {
          id: 'p_xiao_wu_meiyu',
          name: '蕭吳美玉',
          level: 1, // 第1代：父母長輩層
          gender: 'female',
          idCode: '',
          doors: [],
          notes: '冠雙姓（蕭、吳）。相傳歷經多次婚姻，牽動蕭氏祖業與柳家房產之傳承關鍵樞紐。'
        },
        {
          id: 'p_liu_jinfu',
          name: '柳金福',
          level: 2, // 第2代：子女晚輩層 (在父母下方)
          gender: 'male',
          idCode: '', // 謄本資訊
          doors: ['明德路215巷2弄12號 1樓'],
          notes: '父柳清、母蕭吳美玉。為2弄12號1樓所有權人。'
        }
      ],
      relations: [
        { id: 'r_1', from: 'p_liu_qing', to: 'p_xiao_wu_meiyu', type: 'spouse_current', label: '夫妻' },
        { id: 'r_2', from: 'p_liu_qing', to: 'p_liu_jinfu', type: 'parent_child', label: '父子' },
        { id: 'r_3', from: 'p_xiao_wu_meiyu', to: 'p_liu_jinfu', type: 'parent_child', label: '母子' }
      ]
    };

    const STORAGE_KEY = 'mingde_hierarchical_genealogy_v2';
    let appData = loadAppData();
    let network = null;
    let selectedPersonId = null;

    function loadAppData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          return JSON.parse(saved);
        } catch(e) {
          console.warn('載入族譜儲存失敗：', e);
        }
      }
      return JSON.parse(JSON.stringify(LIU_INITIAL_DATA));
    }

    function saveAppData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }

    // 將人物物件格式化為 Vis.js 階層節點
    // 依使用者指示：先顯示名字，下方顯示身分證字號（如果有），之後顯示門牌號（若有多於一個也都顯示）
    function formatPersonToVisNode(person) {
      let labelText = `<b>${person.name}</b>`;

      if (person.idCode && person.idCode.trim()) {
        labelText += `\n<font size="2" color="#94a3b8">${person.idCode.trim()}</font>`;
      }

      if (person.doors && person.doors.length > 0) {
        person.doors.forEach(d => {
          if (d && d.trim()) {
            labelText += `\n<font size="2" color="#38bdf8">🏠 ${d.trim()}</font>`;
          }
        });
      }

      // 依輩份階層上色
      let bgColor = '#1e293b';
      let borderColor = '#64748b';
      let borderWidth = 2;

      if (person.level === 0) {
        borderColor = '#a855f7'; // 紫色 祖輩
      } else if (person.level === 1) {
        borderColor = '#f59e0b'; // 金黃 父母輩
        borderWidth = 3;
      } else if (person.level === 2) {
        borderColor = '#3b82f6'; // 藍色 子女輩
      } else if (person.level === 3) {
        borderColor = '#10b981'; // 綠色 孫輩
      }

      return {
        id: person.id,
        label: labelText,
        level: person.level !== undefined ? person.level : 2, // 決定由上至下的階層
        shape: 'box',
        margin: { top: 12, bottom: 12, left: 16, right: 16 },
        color: {
          background: bgColor,
          border: borderColor,
          highlight: { background: '#0f172a', border: '#ffffff' }
        },
        borderWidth: borderWidth,
        shadow: { enabled: true, color: 'rgba(0,0,0,0.5)', size: 8, x: 2, y: 4 },
        font: {
          multi: 'html',
          color: '#ffffff',
          size: 15,
          face: 'Inter, Noto Sans TC, sans-serif'
        }
      };
    }

    // 將親屬關係轉換為 Vis.js 連線
    function formatRelationToVisEdge(rel) {
      let isDashed = false;
      let color = '#64748b';
      let arrows = { to: { enabled: true, scaleFactor: 0.8 } };

      if (rel.type === 'parent_child') {
        color = '#38bdf8'; // 天藍色 父子/母子直系
      } else if (rel.type === 'spouse_current') {
        color = '#f59e0b'; // 金黃色 夫妻
        arrows = { to: { enabled: false } }; // 夫妻不設方向箭頭
      } else if (rel.type === 'spouse_ex') {
        color = '#fb7185'; // 玫瑰紅 虛線代表前夫/傳聞
        isDashed = true;
        arrows = { to: { enabled: false } };
      } else if (rel.type === 'siblings') {
        color = '#94a3b8'; // 灰色 手足
        arrows = { to: { enabled: false } };
      }

      return {
        id: rel.id,
        from: rel.from,
        to: rel.to,
        label: rel.label || '',
        dashes: isDashed,
        color: { color: color, highlight: '#ffffff' },
        arrows: arrows,
        font: { size: 11, color: '#94a3b8', strokeWidth: 0, align: 'horizontal' },
        smooth: {
          type: 'cubicBezier',
          forceDirection: 'vertical',
          roundness: 0.3
        }
      };
    }

    // 初始化階層族譜圖
    function renderVisNetwork() {
      const container = document.getElementById('networkContainer');
      const visNodes = new vis.DataSet(appData.persons.map(p => formatPersonToVisNode(p)));
      const visEdges = new vis.DataSet(appData.relations.map(r => formatRelationToVisEdge(r)));

      const options = {
        layout: {
          hierarchical: {
            enabled: true,
            direction: 'UD', // 由上至下 Up-Down: 長輩在頂，子女在下
            sortMethod: 'directed',
            levelSeparation: 160,
            nodeSpacing: 220,
            treeSpacing: 240,
            blockShifting: true,
            edgeMinimization: true,
            parentCentralization: true
          }
        },
        physics: {
          hierarchicalRepulsion: {
            nodeDistance: 220
          }
        },
        interaction: {
          hover: true,
          navigationButtons: false,
          zoomView: true,
          dragView: true
        }
      };

      if (network) {
        network.destroy();
      }

      network = new vis.Network(container, { nodes: visNodes, edges: visEdges }, options);

      network.on('click', function(params) {
        if (params.nodes.length > 0) {
          const personId = params.nodes[0];
          openPersonDrawer(personId);
        } else {
          closePersonDrawer();
        }
      });
    }

    // 視野縮放
    function zoomTree(delta) {
      if (!network) return;
      const scale = network.getScale();
      network.moveTo({ scale: scale + delta });
    }

    function fitTree() {
      if (!network) return;
      network.fit({ animation: { duration: 400, easingFunction: 'easeInOutQuad' } });
    }

    // 檢視模式切換：族譜樹狀圖 vs 世代卡片清單
    function switchMainView(view) {
      const treeSec = document.getElementById('treeViewContainer');
      const listSec = document.getElementById('listViewContainer');
      const btnTree = document.getElementById('btnViewTree');
      const btnList = document.getElementById('btnViewList');

      if (view === 'tree') {
        treeSec.classList.remove('hidden');
        listSec.classList.add('hidden');
        btnTree.className = 'px-3 py-1.5 rounded-lg bg-indigo-600 text-white shadow-xs transition';
        btnList.className = 'px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition';
        if (network) network.fit();
      } else {
        treeSec.classList.add('hidden');
        listSec.classList.remove('hidden');
        btnList.className = 'px-3 py-1.5 rounded-lg bg-indigo-600 text-white shadow-xs transition';
        btnTree.className = 'px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition';
        renderGenerationalListView();
      }
    }

    // 世代卡片列表渲染（以輩份階層由上至下分組）
    function renderGenerationalListView() {
      const wrapper = document.getElementById('generationalCardsWrapper');
      wrapper.innerHTML = '';

      const levels = [
        { level: 0, title: '【 第 0 代 • 祖父／祖先長輩層 】', color: 'border-purple-600 text-purple-300' },
        { level: 1, title: '【 第 1 代 • 父母長輩層 】', color: 'border-amber-500 text-amber-300' },
        { level: 2, title: '【 第 2 代 • 子女晚輩層 】', color: 'border-blue-500 text-blue-300' },
        { level: 3, title: '【 第 3 代 • 孫輩後代層 】', color: 'border-emerald-500 text-emerald-300' }
      ];

      levels.forEach(g => {
        const persons = appData.persons.filter(p => p.level === g.level);
        if (persons.length === 0) return;

        const sec = document.createElement('div');
        sec.className = 'bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-sm space-y-4';
        sec.innerHTML = `
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <h2 class="text-sm sm:text-base font-black ${g.color} flex items-center gap-2">
              <span>${g.title}</span>
              <span class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 font-normal">共 ${persons.length} 位</span>
            </h2>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
            ${persons.map(p => `
              <div onclick="openPersonDrawer('${p.id}')" class="p-4 rounded-xl bg-slate-950 border border-slate-800 hover:border-slate-600 cursor-pointer transition shadow-sm space-y-2">
                <div class="flex items-center justify-between">
                  <div class="text-base font-black text-white">${p.name}</div>
                  <span class="text-[10px] px-2 py-0.5 rounded font-bold bg-slate-800 text-slate-300">
                    ${p.gender === 'male' ? '♂ 男性' : p.gender === 'female' ? '♀ 女性' : '長輩'}
                  </span>
                </div>
                ${p.idCode ? `<div class="text-xs font-mono text-slate-400">${p.idCode}</div>` : ''}
                ${p.doors && p.doors.length > 0 ? `
                  <div class="pt-1 space-y-1">
                    ${p.doors.map(d => `
                      <div class="text-xs text-sky-400 font-medium flex items-center gap-1">
                        <span>🏠</span> <span>${d}</span>
                      </div>
                    `).join('')}
                  </div>
                ` : `<div class="text-[11px] text-slate-600">（無登記獨立建物門牌）</div>`}
                ${p.notes ? `<div class="text-[11px] text-slate-400 pt-1 line-clamp-2">${p.notes}</div>` : ''}
              </div>
            `).join('')}
          </div>
        `;
        wrapper.appendChild(sec);
      });
    }

    // 打開人物抽屜
    function openPersonDrawer(personId) {
      selectedPersonId = personId;
      const p = appData.persons.find(x => x.id === personId);
      if (!p) return;

      document.getElementById('drawerPersonName').textContent = p.name;
      document.getElementById('drawerName').textContent = p.name;
      document.getElementById('drawerGeneration').textContent = 
        p.level === 0 ? '第 0 代（祖父長輩）' :
        p.level === 1 ? '第 1 代（父母長輩）' :
        p.level === 2 ? '第 2 代（子女晚輩）' : '第 3 代（孫輩後代）';
      document.getElementById('drawerIdCode').textContent = p.idCode || '（未登記身分證）';
      document.getElementById('drawerRole').textContent = p.gender === 'male' ? '男性 (父/子/兄/弟)' : p.gender === 'female' ? '女性 (母/女/妻/姊/妹)' : '長輩';

      // 門牌
      const doorsContainer = document.getElementById('drawerDoorsList');
      if (p.doors && p.doors.length > 0) {
        doorsContainer.innerHTML = p.doors.map(d => `
          <div class="flex items-center gap-2 p-1.5 rounded bg-slate-900 border border-slate-800">
            <span class="text-sky-400 font-bold">🏠</span>
            <span class="font-medium text-white">${d}</span>
          </div>
        `).join('');
      } else {
        doorsContainer.innerHTML = '<span class="text-slate-500">（無獨立持有門牌）</span>';
      }

      // 關聯清單
      const relContainer = document.getElementById('drawerRelationsList');
      const rels = appData.relations.filter(r => r.from === personId || r.to === personId);
      if (rels.length > 0) {
        relContainer.innerHTML = rels.map(r => {
          const otherId = r.from === personId ? r.to : r.from;
          const otherPerson = appData.persons.find(x => x.id === otherId);
          const otherName = otherPerson ? otherPerson.name : otherId;
          const label = r.label || (r.type === 'parent_child' ? (r.from === personId ? '子女' : '父母') : '配偶/親屬');
          return `
            <div class="flex items-center justify-between p-1.5 rounded bg-slate-900 border border-slate-800">
              <span class="text-indigo-300 font-medium">${label} ➔ ${otherName}</span>
              <button type="button" onclick="deleteRelation('${r.id}')" class="text-rose-400 hover:text-rose-300 text-[10px]" title="解除此關係">✕ 刪除</button>
            </div>
          `;
        }).join('');
      } else {
        relContainer.innerHTML = '<span class="text-slate-500">（尚未建立任何親屬關係）</span>';
      }

      document.getElementById('drawerNotes').textContent = p.notes || '無特殊備註記錄。';
      document.getElementById('personDetailDrawer').classList.remove('hidden');
    }

    function closePersonDrawer() {
      document.getElementById('personDetailDrawer').classList.add('hidden');
      selectedPersonId = null;
    }

    // 新增/編輯人物 Modal
    function openAddPersonModal(editId = null) {
      document.getElementById('personForm').reset();
      document.getElementById('editPersonId').value = editId || '';

      if (editId) {
        const p = appData.persons.find(x => x.id === editId);
        if (p) {
          document.getElementById('personModalTitle').textContent = `編輯人物：${p.name}`;
          document.getElementById('inputName').value = p.name;
          document.getElementById('inputLevel').value = p.level !== undefined ? p.level : 2;
          document.getElementById('inputGender').value = p.gender || 'male';
          document.getElementById('inputIdCode').value = p.idCode || '';
          document.getElementById('inputDoors').value = (p.doors || []).join('\n');
          document.getElementById('inputNotes').value = p.notes || '';
        }
      } else {
        document.getElementById('personModalTitle').textContent = '新增族譜人物';
      }

      document.getElementById('personModal').classList.remove('hidden');
    }

    function closePersonModal() {
      document.getElementById('personModal').classList.add('hidden');
    }

    function handleSavePerson(e) {
      e.preventDefault();
      const editId = document.getElementById('editPersonId').value;
      const name = document.getElementById('inputName').value.trim();
      const level = Number(document.getElementById('inputLevel').value);
      const gender = document.getElementById('inputGender').value;
      const idCode = document.getElementById('inputIdCode').value.trim();
      const rawDoors = document.getElementById('inputDoors').value;
      const notes = document.getElementById('inputNotes').value.trim();

      const doors = rawDoors
        .split(/[\n,，]+/)
        .map(d => d.trim())
        .filter(d => d.length > 0);

      if (editId) {
        const p = appData.persons.find(x => x.id === editId);
        if (p) {
          p.name = name;
          p.level = level;
          p.gender = gender;
          p.idCode = idCode;
          p.doors = doors;
          p.notes = notes;
        }
      } else {
        const newId = 'p_' + Date.now();
        appData.persons.push({
          id: newId,
          name,
          level,
          gender,
          idCode,
          doors,
          notes
        });
      }

      saveAppData();
      closePersonModal();
      renderVisNetwork();
      renderGenerationalListView();
      if (editId) openPersonDrawer(editId);
    }

    function editCurrentSelectedPerson() {
      if (selectedPersonId) openAddPersonModal(selectedPersonId);
    }

    function deleteCurrentSelectedPerson() {
      if (!selectedPersonId) return;
      const p = appData.persons.find(x => x.id === selectedPersonId);
      if (!confirm(`確定要從族譜中刪除【${p ? p.name : '此人'}】嗎？\n相關連線也會一併移除。`)) return;

      appData.persons = appData.persons.filter(x => x.id !== selectedPersonId);
      appData.relations = appData.relations.filter(r => r.from !== selectedPersonId && r.to !== selectedPersonId);

      saveAppData();
      closePersonDrawer();
      renderVisNetwork();
      renderGenerationalListView();
    }

    // 建立關係 Modal
    function openAddRelationModal() {
      const fromSel = document.getElementById('relFromPerson');
      const toSel = document.getElementById('relToPerson');
      fromSel.innerHTML = '';
      toSel.innerHTML = '';

      appData.persons.forEach(p => {
        const opt1 = document.createElement('option');
        opt1.value = p.id;
        opt1.textContent = `${p.name} (第${p.level}代)`;
        fromSel.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = p.id;
        opt2.textContent = `${p.name} (第${p.level}代)`;
        toSel.appendChild(opt2);
      });

      if (selectedPersonId) {
        fromSel.value = selectedPersonId;
      }

      document.getElementById('relationModal').classList.remove('hidden');
    }

    function closeRelationModal() {
      document.getElementById('relationModal').classList.add('hidden');
    }

    function handleSaveRelation(e) {
      e.preventDefault();
      const from = document.getElementById('relFromPerson').value;
      const to = document.getElementById('relToPerson').value;
      const type = document.getElementById('relType').value;
      let label = document.getElementById('relLabel').value.trim();

      if (from === to) {
        alert('請選擇兩位不同的人物建立關係！');
        return;
      }

      if (!label) {
        label = type === 'parent_child' ? '子女' :
                type === 'spouse_current' ? '夫妻' :
                type === 'spouse_ex' ? '前夫/再婚？' : '手足';
      }

      const newRel = {
        id: 'r_' + Date.now(),
        from,
        to,
        type,
        label
      };

      appData.relations.push(newRel);
      saveAppData();
      closeRelationModal();
      renderVisNetwork();
      renderGenerationalListView();
      if (selectedPersonId) openPersonDrawer(selectedPersonId);
    }

    function deleteRelation(relId) {
      appData.relations = appData.relations.filter(r => r.id !== relId);
      saveAppData();
      renderVisNetwork();
      renderGenerationalListView();
      if (selectedPersonId) openPersonDrawer(selectedPersonId);
    }

    // 重設為柳家起點
    function resetToInitialLiuClan() {
      if (!confirm('確定要重置為柳家核心起點（柳清、蕭吳美玉、柳金福）嗎？')) return;
      appData = JSON.parse(JSON.stringify(LIU_INITIAL_DATA));
      saveAppData();
      closePersonDrawer();
      renderVisNetwork();
      renderGenerationalListView();
    }

    // 完全清空畫布
    function clearAllDataConfirm() {
      if (!confirm('確定要「完全清空」所有人物與關係嗎？\n畫面將變為乾淨空白，讓您從零開始輸入。')) return;
      appData = { persons: [], relations: [] };
      saveAppData();
      closePersonDrawer();
      renderVisNetwork();
      renderGenerationalListView();
    }

    // 啟動初始化
    window.addEventListener('DOMContentLoaded', () => {
      renderVisNetwork();
    });
  </script>
</body>
</html>
